name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dakly
          POSTGRES_PASSWORD: dakly
          POSTGRES_DB: dakly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dakly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILPIT_SMTP_HOST: 127.0.0.1
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      REDIS_URL: redis://localhost:6379/15
      DATABASE_ADMIN_URL: postgres://dakly:dakly@localhost:5432/dakly
      DATABASE_URL: postgres://dakly_app:dakly_app@localhost:5432/dakly
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate ephemeral encryption keys
        run: node scripts/development-encryption.mjs --ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:unused
      - run: pnpm lint:duplicates
      - run: pnpm lint:docs
      - name: Prepare database
        run: |
          psql "$DATABASE_ADMIN_URL" -f packages/db/local-init.sql
          pnpm --filter @dakly/db db:migrate
      - run: pnpm test:int
      - name: Install Chromium
        run: pnpm --filter @dakly/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: |
            apps/web/e2e-artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

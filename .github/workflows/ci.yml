name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAILPIT_SMTP_HOST: 127.0.0.1
  MAILPIT_SMTP_PORT: 1025
  MAILPIT_API_URL: http://127.0.0.1:8025
  REDIS_URL: redis://localhost:6379/15
  DATABASE_ADMIN_URL: postgres://dakly:dakly@localhost:5432/dakly
  DATABASE_URL: postgres://dakly_app:dakly_app@localhost:5432/dakly
  R2_ENDPOINT: http://127.0.0.1:8333
  R2_BUCKET: dakly-local
  R2_ACCESS_KEY_ID: dakly-local
  R2_SECRET_ACCESS_KEY: dakly-local-secret

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # The schema imports @dakly/contracts from dist, so this runs after the build.
      - run: pnpm db:drift
      - run: pnpm lint:unused
      - run: pnpm lint:duplicates
      - run: pnpm lint:docs
      - run: pnpm audit --prod --audit-level high

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dakly
          POSTGRES_PASSWORD: dakly
          POSTGRES_DB: dakly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dakly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The migration runs from packages/db/dist.
      - run: pnpm build
      - name: Prepare database
        run: |
          psql "$DATABASE_ADMIN_URL" -f packages/db/local-init.sql
          pnpm --filter @dakly/db db:migrate
      # A service container cannot take SeaweedFS's command flags, so it runs from the compose file.
      - run: docker compose up -d --wait seaweedfs
      - run: pnpm test:int

  e2e:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dakly
          POSTGRES_PASSWORD: dakly
          POSTGRES_DB: dakly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dakly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The migration runs from packages/db/dist, and the browser fixture loads packages/core/dist.
      - run: pnpm build
      - name: Prepare database
        run: |
          psql "$DATABASE_ADMIN_URL" -f packages/db/local-init.sql
          pnpm --filter @dakly/db db:migrate
      - name: Install Chromium
        run: pnpm --filter @dakly/web exec playwright install --with-deps chromium
      - run: docker compose up -d --wait seaweedfs
      - run: pnpm test:e2e
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: browser-tests
          path: |
            apps/web/e2e-artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the release; change both values together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pull requests scan their own commits; pushes to main scan the full history.
          range=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range=("--log-opts=$BASE_SHA..$HEAD_SHA"); fi
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner "${range[@]}" .

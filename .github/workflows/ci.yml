name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dakly
          POSTGRES_PASSWORD: dakly
          POSTGRES_DB: dakly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dakly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://dakly:dakly@localhost:5432/dakly
      DATABASE_URL: postgres://dakly_app:dakly_app@localhost:5432/dakly
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:unused
      - run: pnpm lint:duplicates
      - run: pnpm lint:docs
      - name: Prepare database
        run: |
          psql "$DATABASE_ADMIN_URL" -f packages/db/local-init.sql
          pnpm --filter @dakly/db db:migrate
      - run: pnpm test:int

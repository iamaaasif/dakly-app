name: PR rules

on:
  pull_request:
    # Editing the title or changing labels re-runs the check.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The size check diffs from the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The script uses only Node built-ins, so this job installs no pnpm or dependencies.
          package-manager-cache: false
      # Pull request text goes through the environment, never into the script itself.
      - run: node scripts/check-pull-request.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

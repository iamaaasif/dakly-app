# Local development only: Postgres (with pgvector), Redis and Mailpit. Production uses DigitalOcean managed services.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dakly
      POSTGRES_PASSWORD: dakly
      POSTGRES_DB: dakly
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/local-init.sql:/docker-entrypoint-initdb.d/local-init.sql:ro
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:

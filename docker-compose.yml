# Local development only: Postgres (with pgvector) and Redis. Production uses DigitalOcean managed services.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dakly
      POSTGRES_PASSWORD: dakly
      POSTGRES_DB: dakly
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/local-init.sql:/docker-entrypoint-initdb.d/local-init.sql:ro
  redis:
    image: redis:7
    ports:
      - '6379:6379'
volumes:
  postgres-data:
